name: Deploy Hugging Face Space

# Manual fallback only. Automatic deploys run through sync-to-hf.yml on every
# push to main; running both uploaded the same commit twice.
on:
  workflow_dispatch:

concurrency:
  group: deploy-huggingface-space
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HF_SPACE_ID: DyrakArmy/claimradar-bg
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install "huggingface_hub>=0.34.0"

      - name: Validate Python sources
        run: python -m compileall -q .

      - name: Run focused deployment tests
        run: |
          pytest -q \
            tests/test_desktop_artifact_helper.py \
            tests/test_desktop_artifact_testing_docs.py \
            tests/test_backend_repair_ui.py \
            tests/test_mobile_remote_control.py \
            tests/test_easy_remote_access.py

      - name: Verify Hugging Face token exists
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing GitHub Actions secret: HF_TOKEN" >&2
            exit 1
          fi

      - name: Deploy tested public Space
        run: python scripts/deploy_hf_space.py

      - name: Deployment summary
        shell: bash
        run: |
          echo "## Hugging Face public deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Space: https://huggingface.co/spaces/DyrakArmy/claimradar-bg" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
